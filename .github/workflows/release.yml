name: Release

# Least privilege by default: the release jobs hold the NuGet API key, both Docker Hub tokens and
# npm publish OIDC, so a compromised action should inherit as little as possible. Jobs that need
# more (id-token for OIDC, contents: write for releases) declare it themselves.
permissions:
  contents: read

on:
  push:
    tags: ['v*']

env:
  DOCKERHUB_SERVER: drawboardci/authagonal
  DOCKERHUB_MIGRATION: drawboardci/authagonal-migration
  DOCKERHUB_DEMO_SERVER: authagonal/authagonal-demo-server
  DOCKERHUB_DEMO_SAMPLE_API: authagonal/authagonal-demo-sample-api
  DOCKERHUB_DEMO_FRONTEND: authagonal/authagonal-demo-frontend

jobs:
  # The frontend gates — npm advisories across every workspace, and login-app locale parity —
  # checked before anything is published. Both jobs must pass; same gate that runs on every push
  # and PR. See audit.yml.
  audit:
    uses: ./.github/workflows/audit.yml

  # The .NET gate. Nothing gated publishing on the test suite: `publish-nuget` below declared no
  # `needs:` at all, so every package on nuget.org shipped on `dotnet pack` succeeding, and the npm
  # jobs waited only on the frontend audit. The regression tests that pin each of this repository's
  # security fixes could all have been red. See build.yml.
  test:
    uses: ./.github/workflows/build.yml

  publish-nuget:
    needs: [audit, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.110' # must match global.json — see the note there

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Two things changed on every line below, on the one runner whose output the world installs.
      #
      # RestoreLockedMode: packages.lock.json is committed for every project, but nothing made a
      # build honour it — a plain restore silently REWRITES the lock file when the resolved graph
      # drifts, which is exactly the case the lock file exists to catch. Every project floats at
      # least one dependency (10.*, 9.*, 4.*), so a newer — or replaced — Npgsql, AWSSDK or
      # Azure.Storage.Blobs could resolve here and be packed into a release with no build failure and
      # nothing in the diff to review. Locked mode makes that a build error, so a graph change has to
      # arrive as a deliberate commit (dotnet restore --force-evaluate) rather than as a surprise
      # between two builds of the same source. It is set per pack rather than on a whole-solution
      # restore because demos/custom-server floats Authagonal.* at 0.*, which by design resolves to
      # something new every release and would fail locked mode on every run.
      #
      # "$VERSION", not ${{ }}: the tag is attacker-supplied text — git check-ref-format permits $,
      # (, ), backtick — and GitHub substitutes ${{ }} into the run block before the shell ever
      # parses it, so a tag named v1.0.0$(curl…) executes on the runner that holds NUGET_API_KEY and
      # both Docker Hub tokens. Through an env var it is data the shell expands, never code it parses.
      #
      # The flag is belt and braces with Directory.Build.props, which also turns RestoreLockedMode on
      # from the CI=true that Actions sets. Fix a locked-mode failure by running `dotnet restore`
      # locally and committing the updated lock file — deliberately.
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/Authagonal.Core/Authagonal.Core.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.Protocol/Authagonal.Protocol.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.AzureProvider/Authagonal.AzureProvider.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.AwsProvider/Authagonal.AwsProvider.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.SqlProvider/Authagonal.SqlProvider.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.Server/Authagonal.Server.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.Bff/Authagonal.Bff.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.Backup/Authagonal.Backup.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs
          dotnet pack src/Authagonal.Migration/Authagonal.Migration.csproj -c Release -p:RestoreLockedMode=true -p:Version="$VERSION" -o nupkgs

      # The key reaches the step as an environment variable rather than being substituted into the
      # run block, which is what GitHub writes to a script file on the runner's disk before executing
      # it. It is still a long-lived static credential and it is still visible in the pushing
      # process's own /proc/*/cmdline; the end state is NuGet Trusted Publishing (OIDC, short-lived,
      # like the --provenance npm jobs below), which needs a publishing policy configured on
      # nuget.org before this step can move to it.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push nupkgs/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Hand the just-built nupkgs to the docker job so it can restore them
      # locally instead of waiting 4–6 min for nuget.org indexing.
      - name: Upload nupkgs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          retention-days: 1

  publish-npm:
    needs: [audit, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: login-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm publish --access public --provenance

      - name: Wait for npm indexing
        run: |
          # The publish above already succeeded — this only waits for npm's read side to catch up
          # so downstream sees the version. npm's read-after-publish propagation now routinely
          # exceeds a couple of minutes, and a timeout here was failing the whole release (and
          # skipping publish-npm-bff, which needs this job) for a package that IS published. Warn,
          # never fail.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Waiting for @authagonal/login@$VERSION on npm..."
          for i in $(seq 1 36); do
            if npm view "@authagonal/login@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
              echo "Package indexed after ~$(( i * 5 )) seconds"
              exit 0
            fi
            echo "  attempt $i/36 — not yet indexed, waiting 5s..."
            sleep 5
          done
          echo "::warning::npm indexing not confirmed in 180s — the package published fine, continuing"
          exit 0

  publish-npm-bff:
    needs: [audit, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: bff-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm publish --access public --provenance

  docker:
    needs: [publish-nuget, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pull in the freshly-published nupkgs so the demo Dockerfile's
      # dotnet restore picks them up via ./NuGet.Config without needing
      # nuget.org to have indexed them yet.
      - name: Download nupkgs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: nupkgs

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: drawboardci
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_SERVER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Extract metadata (migration)
        id: meta-migration
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_MIGRATION }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Built locally first and scanned BEFORE it is pushed. Nothing gated the published image on a
      # vulnerability scan, so a base with a known fixable CRITICAL shipped as a release without
      # anything in the pipeline noticing. Failing here costs a release; not failing here ships it to
      # everyone who pulls the tag.
      - name: Build server image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: authagonal-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Trivy version pinned EXPLICITLY, because setup-trivy's own default resolved to v0.64.1 — a tag
        # that does not exist as a release. Every run then failed in "installing Trivy binary", after
        # printing "found version: 0.64.1", with no scan and no CVE involved. It broke the v0.22.0 release
        # twice, identically, so it is not transient: an upstream default pointing at a withdrawn release
        # cannot fix itself. Pinning here means the scanner version moves when someone changes this line.
        with:
          version: v0.73.0
          image-ref: authagonal-server:scan
          format: table
          exit-code: '1'
          # Only what an operator could actually act on: a vulnerability with no fix available would
          # block every release indefinitely without making anyone safer.
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Build and push server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.migration
          push: true
          tags: ${{ steps.meta-migration.outputs.tags }}
          labels: ${{ steps.meta-migration.outputs.labels }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Extract metadata (demo-server)
        id: meta-demo-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_DEMO_SERVER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Extract metadata (demo-sample-api)
        id: meta-demo-sample-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_DEMO_SAMPLE_API }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Extract metadata (demo-frontend)
        id: meta-demo-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_DEMO_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Demo images publish to the public `authagonal` Docker Hub org (not drawboardci).
      # Re-login as the authagonal org for the demo pushes below.
      - name: Log in to Docker Hub (authagonal org)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: authagonal
          password: ${{ secrets.DOCKERHUB_AUTHAGONAL_TOKEN }}

      - name: Build and push demo server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demos/custom-server/Dockerfile
          push: true
          tags: ${{ steps.meta-demo-server.outputs.tags }}
          labels: ${{ steps.meta-demo-server.outputs.labels }}
          no-cache: true

      - name: Build and push demo sample API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demos/sample-app/SampleApp.Api/Dockerfile
          push: true
          tags: ${{ steps.meta-demo-sample-api.outputs.tags }}
          labels: ${{ steps.meta-demo-sample-api.outputs.labels }}
          cache-from: type=gha,scope=demo-sample-api
          cache-to: type=gha,mode=max,scope=demo-sample-api

      - name: Build and push demo frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demos/sample-app/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-demo-frontend.outputs.tags }}
          labels: ${{ steps.meta-demo-frontend.outputs.labels }}
          cache-from: type=gha,scope=demo-frontend
          cache-to: type=gha,mode=max,scope=demo-frontend

  # NOTE: the demo is deployed manually by the authagonal-cloud repo
  # (run its "Demo (deploy to prod)" workflow, or push under k8s/demo/).
