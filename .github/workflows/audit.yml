# The frontend gates: npm advisories across every workspace, and login-app locale drift.
#
# Both are here because both are failures that no other check can see. A vulnerable build
# dependency compiles fine; a missing translation renders fine (in English). Nothing else in the
# repository would report either one.
#
# (File name is audit.yml rather than something broader so the `uses:` reference in release.yml
# stays put. The jobs below are what it does.)
#
# --- npm audit ---
# None of it reaches the running identity provider — the Dockerfile runs `npm run build:spa` and
# ships only the built output, so no Vite dev server and no PostCSS runtime is in the image. It is
# the BUILD that is exposed: the postcss and babel `sourceMappingURL` issues read arbitrary files
# off whatever machine processes a CSS or JS file, and the machine that processes them here is a
# GitHub runner whose sibling jobs hold the NuGet API key, both Docker Hub tokens and npm publish
# OIDC. A stale lockfile on that runner is worth catching.
#
# The lockfiles are committed and CI installs with `npm ci`, which is the right setup — this is the
# part that notices when it goes stale.
name: Frontend checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly. Advisories are published against versions that stopped changing months ago, so a
    # repository with no commits still drifts.
    - cron: '0 5 * * 1'
  # Called by the release workflow, which gates publishing on it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      # Every workspace reports, rather than the first failure hiding the rest.
      fail-fast: false
      matrix:
        dir:
          - login-app
          - bff-lib
          - demos/sample-app/frontend
          - demos/custom-server/login-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: npm audit (high and critical)
        working-directory: ${{ matrix.dir }}
        env:
          # Advisories that are knowingly carried, by GHSA id, space-separated. An entry belongs
          # here only when there is no fix short of a breaking major bump, and it comes straight
          # back out the moment there is one.
          #
          #   GHSA-mh99-v99m-4gvg — brace-expansion unbounded-expansion OOM. Reached only through
          #   eslint 9's minimatch@3, which pins brace-expansion ^1.1.7; the fix lands in
          #   brace-expansion 5.0.8 and is backported to no earlier line, so `npm audit fix` offers
          #   nothing but eslint@10. eslint is not on the publish path — release runs `npm ci`,
          #   `npm run build`, `npm publish`, and never invokes it.
          ACCEPTED: GHSA-mh99-v99m-4gvg
        run: |
          # `npm audit` exits non-zero when it finds anything, so the exit code is deliberately
          # ignored here — the filter below decides, not npm.
          npm audit --json > audit.json || true

          UNACCEPTED=$(jq -r --arg accepted "$ACCEPTED" '
            ($accepted | split(" ")) as $ok
            | [ (.vulnerabilities // {}) | to_entries[] | .value
                | select(.severity == "high" or .severity == "critical")
                | .via[] | select(type == "object")
                | { id: (.url | split("/") | last), severity: .severity, title: .title } ]
            | unique_by(.id)
            | map(select(.id as $i | ($ok | index($i)) | not))
            | .[] | "  \(.severity)\t\(.id)\t\(.title)"
          ' audit.json)

          if [ -n "$UNACCEPTED" ]; then
            echo "::error::${{ matrix.dir }}: high or critical advisories with no accepted exception"
            echo "$UNACCEPTED"
            echo
            echo "Run 'npm audit fix' in ${{ matrix.dir }} and commit the lockfile."
            exit 1
          fi

          echo "${{ matrix.dir }}: no unaccepted high or critical advisories."

  # The TypeScript BFF's unit tests. @authagonal/bff is a second implementation of Authagonal.Bff, and
  # its security guards — which upstream a proxied path belongs to, which tenant a back-channel logout
  # may purge — had all drifted out of it while the .NET side was fixed and covered by
  # tests/Authagonal.Tests. Nothing in the .NET build looks at this package, so without this job the
  # divergence is invisible again the moment it reappears.
  bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        working-directory: bff-lib
        run: npm ci

      # `npm test` builds first: the tests are plain JS over the compiled output, so a type error is
      # also a test failure.
      - name: Unit tests
        working-directory: bff-lib
        run: npm test

  # The login SPA's unit tests. This package had no test runner at all, which meant its exported
  # open-redirect control — resolveRedirect, the THIRD implementation of a guard whose other two
  # (Authagonal.Core/Services/LocalRedirect and the BFF's return-URL check) are both table-tested —
  # was the one nobody could assert on. The same gap left the GDPR export's content-type guard
  # untestable: without it, a self-hosted deployment answers /api/v1/account/export with 200 and
  # this SPA's own HTML, which the client saved as the user's personal data.
  #
  # `vitest run` typechecks nothing on its own, so `tsc -b` runs alongside it — the build script
  # already pairs them and a type error in a test file must not pass silently.
  login-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        working-directory: login-app
        run: npm ci

      - name: Typecheck
        working-directory: login-app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: login-app
        run: npm test

  # Locale drift. i18next falls back to en for any key a locale is missing, so a dropped
  # translation ships as untranslated English and nothing anywhere reports it — which is how
  # oidcErrorGeneric stayed missing from seven of the ten shipped locales. No npm install: the
  # script is dependency-free node, so this job is a checkout and a few milliseconds.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Same command a developer runs locally. The check lives in the repo, not in this file, so
      # adding a key can be verified before it is pushed rather than after.
      - name: Locale key parity
        working-directory: login-app
        run: npm run check:i18n
