# Default: the server on SQLite — one file, nothing else to run.
#
#   docker compose up
#
# The other backends override this same service (rather than adding a second one, which would fight
# over port 8080):
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
#   docker compose -f docker-compose.yml -f docker-compose.azure.yml up
#
# All three serve on http://localhost:8080.
services:
  authagonal:
    build: .
    ports:
      - "8080:8080"
    environment:
      - Storage__Provider=sqlite
      - Storage__ConnectionString=Data Source=/data/authagonal.db
      - Issuer=http://localhost:8080
    volumes:
      - authagonal-sqlite:/data

volumes:
  authagonal-sqlite:
