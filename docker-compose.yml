services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table

  authagonal:
    build: .
    ports:
      - "8080:8080"
    environment:
      - Storage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - Issuer=http://localhost:8080
      # This compose file serves the OAuth endpoints over plain http, which RFC 6749 §3.1/§3.2
      # forbid, so the TLS gate has to be opted out of explicitly. Fine for a laptop; put a
      # TLS-terminating proxy in front and drop this line for anything reachable by anyone else.
      - Auth__AllowInsecureHttp=true
    depends_on:
      - azurite
